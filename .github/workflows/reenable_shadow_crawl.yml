name: Reenable Shadow Crawl

on:
  schedule:
    - cron: '10 15 31 7 *'
    - cron: '10 21 31 7 *'
    - cron: '10 3 1 8 *'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  reenable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.enableWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'shadow_crawl.yml'
            });
